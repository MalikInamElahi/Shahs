<body class="bg-slate-950 font-sans text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
<div id="screen-login" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<div class="absolute inset-0 opacity-30">
<div class="absolute top-0 -left-4 w-72 h-72 bg-amber-500 rounded-full mix-blend-multiply filter blur-xl animate-pulse"></div>
<div class="absolute bottom-0 -right-4 w-72 h-72 bg-amber-600 rounded-full mix-blend-multiply filter blur-xl animate-pulse delay-1000"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-amber-400 rounded-full mix-blend-multiply filter blur-2xl animate-pulse delay-2000"></div>
</div>
<div class="glass rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 relative z-10 border border-white/5 slide-in">
<div class="text-center space-y-4">
<div class="inline-flex p-2 rounded-3xl bg-gradient-to-br from-amber-500/20 to-amber-600/20 border border-amber-500/20 shadow-lg">
<img id="login-logo-image" class="hidden rounded-2xl object-contain" alt="Logo" style="width:84px;height:84px;background:#fff;">
<div id="login-logo-placeholder" class="rounded-2xl flex items-center justify-center shadow-inner" aria-label="Shah's" style="width:84px;height:84px;background:linear-gradient(135deg,#fbbf24,#d97706);">
<i class="fas fa-store" style="font-size:42px;color:#0f172a;"></i>
</div>
</div>
<div>
<h1 class="text-2xl font-black text-white tracking-tight">Shah's Halal Food</h1>
<p class="text-sm text-amber-400 font-semibold mt-1">We stand with Quality &amp; Quantity</p>
</div>
</div>
<div class="space-y-4 mt-8">
<div>
<label class="block mb-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wider">Branch</label>
<select id="login-branch" class="w-full p-3.5 border border-slate-700 rounded-xl bg-slate-800/50 text-white text-sm font-medium cursor-pointer focus:border-amber-500 transition">
<option value="West Drayton">West Drayton</option>
<option value="Uxbridge">Uxbridge</option>
<option value="Hillingdon">Hillingdon</option>
<option value="H&F">H&F</option>
</select>
</div>
<div>
<label class="block mb-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wider">Username</label>
<input type="text" id="login-username" autocapitalize="none" autocorrect="off" enterkeyhint="next" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('login-password').focus();}" placeholder="Enter your username" class="w-full p-3.5 border border-slate-700 rounded-xl bg-slate-800/50 text-white text-sm font-medium focus:border-amber-500 transition">
</div>
<div>
<label class="block mb-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
<input type="password" id="login-password" enterkeyhint="go" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();handleLogin();}" onfocus="setTimeout(function(){try{document.getElementById('login-signin-btn').scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}},350)" placeholder="Enter your password" class="w-full p-3.5 border border-slate-700 rounded-xl bg-slate-800/50 text-white text-sm font-medium focus:border-amber-500 transition">
</div>
<button type="button" id="login-signin-btn" onclick="handleLogin()" class="btn-primary w-full text-slate-950 font-bold py-3.5 rounded-xl shadow-lg cursor-pointer transition text-sm">
<i class="fas fa-arrow-right-to-bracket mr-2"></i>
Sign In
</button>
</div>
<div class="mt-6 pt-5 border-t border-white/5">
<div class="flex flex-col sm:flex-row items-center sm:justify-between gap-1 mb-3 text-center">
<span class="text-xs font-semibold text-slate-400 uppercase tracking-wider"><i class="fas fa-palette text-amber-400 mr-1.5"></i>Colour theme</span>
<span id="theme-name" class="text-xs font-semibold text-amber-400"></span>
</div>
<div id="theme-dots" class="flex flex-wrap items-center justify-center sm:justify-start gap-2 sm:gap-2.5 text-slate-400"></div>
</div>
<div class="mt-6 text-center">
<p class="text-xs text-slate-500">If you forget your username/Password please contact to the management.</p>
</div>
</div>
</div>

<i class="fas fa-store" style="font-size:17px;color:#0f172a;"></i>
</div>

</div>
<div>
<h2 id="company-name-display" class="font-black text-sm text-white leading-tight tracking-tight">Operations</h2>
<span id="company-tagline-display" class="text-[10px] font-bold text-amber-500 uppercase tracking-widest">Management System</span>
